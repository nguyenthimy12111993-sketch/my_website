<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 搜索列表入场动画 */
        .fade-in-up { 
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            opacity: 0; 
            transform: translateY(12px); 
        }
        @keyframes fadeInUp { 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* 模态框弹性弹出动画 */
        .modal-enter { 
            animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        @keyframes modalPop { 
            0% { opacity: 0; transform: scale(0.95); } 
            100% { opacity: 1; transform: scale(1); } 
        }

        /* 隐藏滚动条但保留功能 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col relative overflow-x-hidden">
    
    <div class="flex justify-end p-4 text-sm gap-4 items-center h-14">
        <a href="#" class="text-gray-700 hover:underline">关于</a>
        <a href="#" class="text-gray-700 hover:underline">学术空间</a>
        <div class="w-8 h-8 bg-blue-600 rounded-full text-white flex items-center justify-center font-medium shadow-sm cursor-pointer hover:bg-blue-700 transition-colors">U</div>
    </div>

    <main id="mainContainer" class="flex-grow flex flex-col justify-center items-center px-4 transition-all duration-700 ease-in-out w-full pb-32">
        
        <div id="logoContainer" class="text-center mb-8 transition-all duration-700">
            <h1 id="logoTitle" class="text-5xl sm:text-6xl font-extrabold tracking-tight transition-all duration-700">
                <span class="text-[#4285f4]">学</span><span class="text-[#ea4335]">生</span><span class="text-[#fbbc05]">信</span><span class="text-[#4285f4]">息</span><span class="text-[#34a853]">查</span><span class="text-[#ea4335]">询</span><span class="text-[#fbbc05]">系</span><span class="text-[#34a853]">统</span>
            </h1>
        </div>

        <div class="w-full max-w-[584px] relative group transition-all duration-500 z-20" id="searchBoxContainer">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5 text-gray-400"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"></path></svg>
            </div>
            
            <input type="text" id="keywordInput" placeholder="输入学生姓名或学号进行查询" 
                   class="block w-full pl-12 pr-4 py-3.5 bg-white border border-gray-200 rounded-full hover:shadow-[0_1px_6px_rgba(32,33,36,.28)] hover:border-transparent focus:shadow-[0_1px_6px_rgba(32,33,36,.28)] focus:border-transparent focus:outline-none text-base transition-all duration-200">
        </div>

        <div class="flex justify-center gap-3 mt-7 transition-opacity duration-300" id="searchButtons">
            <button onclick="handleSearch()" class="bg-[#f8f9fa] border border-[#f8f9fa] hover:border-gray-300 hover:shadow-sm text-gray-800 text-sm px-6 py-2 rounded focus:outline-none transition-all">搜 索</button>
        </div>

        <div id="learnMoreSection" class="w-full max-w-[584px] mt-10 grid grid-cols-1 sm:grid-cols-2 gap-4 transition-all duration-500">
            <a href="https://www.guet.edu.cn" target="_blank" class="flex items-center p-4 bg-white border border-gray-200 rounded-xl hover:shadow-md transition-all group">
                <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center mr-4 group-hover:bg-blue-100 transition-colors">
                    <span class="text-xl">🏫</span>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-gray-800 group-hover:text-blue-600 transition-colors">桂林电子科技大学</h3>
                    <p class="text-xs text-gray-500 mt-0.5">访问官方网站了解更多</p>
                </div>
            </a>
            <a href="https://www.google.com" target="_blank" class="flex items-center p-4 bg-white border border-gray-200 rounded-xl hover:shadow-md transition-all group">
                <div class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center mr-4 group-hover:bg-green-100 transition-colors">
                    <span class="text-xl">🔍</span>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-gray-800 group-hover:text-green-600 transition-colors">Google 搜索</h3>
                    <p class="text-xs text-gray-500 mt-0.5">跳转到全球最大搜索引擎</p>
                </div>
            </a>
        </div>

        <div id="backButtonContainer" class="w-full max-w-[584px] mt-6 hidden justify-start transition-all duration-300">
            <button onclick="resetSearch()" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 hover:text-blue-600 transition-colors px-3 py-1.5 rounded-lg hover:bg-gray-100">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                返回
            </button>
        </div>

        <div id="resultsArea" class="w-full max-w-[584px] mt-2 flex flex-col gap-3 hidden"></div>
    </main>

    <footer class="bg-[#f2f2f2] text-[#70757a] text-sm mt-auto z-10">
        <div class="px-6 py-3 border-b border-[#dadce0]">
            中国
        </div>
        <div class="px-6 py-3 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex gap-6 mb-3 sm:mb-0">
                <a href="#" class="hover:text-gray-800 transition-colors">关于系统</a>
                <a href="#" class="hover:text-gray-800 transition-colors">广告</a>
                <a href="#" class="hover:text-gray-800 transition-colors">商务</a>
            </div>
            <div class="flex gap-6">
                <a href="https://www.baidu.com" target="_blank" class="font-medium text-gray-600 hover:text-blue-600 transition-colors flex items-center gap-1 group">
                    <span>了解更多？我来给你百度一下</span>
                    <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>
        </div>
    </footer>

    <div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <div class="relative w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden modal-enter">
            <div class="absolute top-4 right-4">
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-8 text-center pt-10">
                <div id="modalAvatar" class="w-20 h-20 mx-auto bg-[#e8f0fe] text-[#1a73e8] rounded-full flex items-center justify-center text-3xl font-bold mb-4"></div>
                <h3 id="modalName" class="text-2xl font-bold text-gray-900 mb-1"></h3>
                <p id="modalId" class="text-[#70757a] font-mono text-sm mb-6"></p>
                
                <div class="space-y-3 text-left">
                    <div class="bg-gray-50 p-4 rounded-2xl flex items-center justify-between border border-gray-100">
                        <span class="text-gray-500 text-sm font-medium">🏫 学校</span>
                        <span id="modalSchool" class="text-gray-900 font-medium text-sm"></span>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-2xl flex items-center justify-between border border-gray-100">
                        <span class="text-gray-500 text-sm font-medium">🏢 宿舍</span>
                        <span id="modalDorm" class="text-gray-900 font-medium text-sm"></span>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-2xl flex items-center justify-between border border-gray-100">
                        <span class="text-gray-500 text-sm font-medium">📚 年级</span>
                        <span id="modalGrade" class="text-gray-900 font-medium text-sm"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStudentsData = [];

        // 将界面从居中过渡为顶部搜索状态
        function switchToSearchLayout() {
            const mainContainer = document.getElementById('mainContainer');
            const logoTitle = document.getElementById('logoTitle');
            const learnMoreSection = document.getElementById('learnMoreSection');
            const searchButtons = document.getElementById('searchButtons');
            const resultsArea = document.getElementById('resultsArea');
            const backButtonContainer = document.getElementById('backButtonContainer');

            // 移除高度居中，改为靠上对齐
            mainContainer.classList.remove('justify-center');
            mainContainer.classList.add('justify-start', 'pt-8', 'sm:pt-12');

            // 缩小顶部 Logo
            logoTitle.classList.remove('text-5xl', 'sm:text-6xl');
            logoTitle.classList.add('text-3xl', 'sm:text-4xl');

            // 隐藏初始的附加选项，显示结果区和返回按钮
            learnMoreSection.style.display = 'none';
            searchButtons.style.display = 'none';
            
            backButtonContainer.classList.remove('hidden');
            backButtonContainer.classList.add('flex');
            resultsArea.classList.remove('hidden');
        }

        // 返回初始的居中搜索状态
        function resetSearch() {
            const mainContainer = document.getElementById('mainContainer');
            const logoTitle = document.getElementById('logoTitle');
            const learnMoreSection = document.getElementById('learnMoreSection');
            const searchButtons = document.getElementById('searchButtons');
            const resultsArea = document.getElementById('resultsArea');
            const backButtonContainer = document.getElementById('backButtonContainer');
            const keywordInput = document.getElementById('keywordInput');

            // 清空搜索框
            keywordInput.value = '';

            // 恢复高度居中
            mainContainer.classList.remove('justify-start', 'pt-8', 'sm:pt-12');
            mainContainer.classList.add('justify-center');

            // 恢复顶部 Logo 尺寸
            logoTitle.classList.remove('text-3xl', 'sm:text-4xl');
            logoTitle.classList.add('text-5xl', 'sm:text-6xl');

            // 恢复显示初始选项，隐藏结果区和返回按钮
            learnMoreSection.style.display = ''; // 清除内联样式恢复 Grid
            searchButtons.style.display = '';    // 清除内联样式恢复 Flex
            
            backButtonContainer.classList.add('hidden');
            backButtonContainer.classList.remove('flex');
            resultsArea.classList.add('hidden');
        }

        async function handleSearch() {
            const keyword = document.getElementById('keywordInput').value.trim();
            const resultsArea = document.getElementById('resultsArea');
            
            if (!keyword) return;

            // 触发排版变换动效
            switchToSearchLayout();
            
            // 展示加载动画
            resultsArea.innerHTML = `
                <div class="flex items-center justify-center py-16">
                    <div class="w-8 h-8 border-4 border-[#e8f0fe] border-t-[#1a73e8] rounded-full animate-spin"></div>
                </div>
            `;

            try {
                const queryParams = encodeURIComponent(keyword);
                // 修改点：去掉了 http://127.0.0.1:8000，直接使用相对路径请求当前服务器的接口
                const response = await fetch('/api/search?keyword=' + queryParams);
                const resData = await response.json();

                if (resData.status === "success" && resData.data.length > 0) {
                    currentStudentsData = resData.data;
                    resultsArea.innerHTML = renderCards(currentStudentsData);
                } else {
                    // 无结果的提示
                    resultsArea.innerHTML = `
                        <div class="py-8 px-5 bg-white rounded-2xl border border-gray-100">
                            <p class="text-gray-800 text-base mb-3">找不到和您查询的 "<span class="font-bold">${keyword}</span>" 相符的学生信息。</p>
                            <p class="text-[#70757a] text-sm mb-2">建议：</p>
                            <ul class="text-[#70757a] text-sm list-disc pl-5 space-y-1">
                                <li>请检查输入字词有无错误。</li>
                                <li>请尝试使用如姓名、学号等其他查询词。</li>
                            </ul>
                        </div>
                    `;
                }
            } catch (error) {
                resultsArea.innerHTML = `
                    <div class="text-center py-16 text-red-500 bg-white rounded-2xl border border-gray-100">
                        <p class="font-bold text-lg">无法连接到后端服务器</p>
                        <p class="text-sm mt-2 text-gray-500">请确保您的 uvicorn main:app --reload 正在运行中</p>
                    </div>
                `;
            }
        }

        // 渲染列表卡片
        function renderCards(dataArr) {
            return dataArr.map((item, index) => {
                const actualIndex = currentStudentsData.indexOf(item);
                const delay = (index * 0.05); 
                
                return `
                <div onclick="openModal(${actualIndex})" 
                     class="fade-in-up cursor-pointer bg-white p-4 rounded-2xl border border-gray-100 hover:shadow-[0_2px_10px_rgba(32,33,36,0.08)] transition-all duration-300 flex items-center justify-between group"
                     style="animation-delay: ${delay}s;">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-[#f1f3f4] text-[#1a73e8] rounded-full flex items-center justify-center text-xl font-bold group-hover:bg-[#e8f0fe] transition-colors">
                            ${item.name.charAt(0)}
                        </div>
                        <div>
                            <h3 class="text-lg font-medium text-[#1a0dab] group-hover:underline">${item.name}</h3>
                            <p class="text-[#4d5156] text-sm mt-0.5">学号: ${item.student_id}</p>
                        </div>
                    </div>
                    <div class="text-gray-400 group-hover:text-[#1a73e8] pr-2 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>
            `}).join('');
        }

        function openModal(index) {
            const student = currentStudentsData[index];
            document.getElementById('modalAvatar').textContent = student.name.charAt(0);
            document.getElementById('modalName').textContent = student.name;
            document.getElementById('modalId').textContent = '学号: ' + student.student_id;
            document.getElementById('modalSchool').textContent = student.school;
            document.getElementById('modalDorm').textContent = student.dormitory;
            document.getElementById('modalGrade').textContent = student.grade;
            
            const modal = document.getElementById('detailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto'; 
        }

        // 敲击回车键触发搜索
        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
