<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>学生信息查询系统</title>
    <style>
        /* ========== CSS Reset & Design Tokens ========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ios-blue:        #007AFF;
            --ios-blue-hover:  #0062CC;
            --ios-red:         #FF3B30;
            --ios-green:       #34C759;
            --ios-orange:      #FF9500;
            --ios-bg:          #F2F2F7;
            --ios-card:        #FFFFFF;
            --ios-separator:   rgba(60, 60, 67, 0.10);
            --ios-text:        #1C1C1E;
            --ios-secondary:   #8E8E93;
            --ios-fill:        #E5E5EA;
            --ios-nav-blur:    rgba(242, 242, 247, 0.72);
            --nav-height:      56px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #F0F0F5;
            color: var(--ios-text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========== Animated Wave Background ========== */
        .bg-waves {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-waves .wave-layer {
            position: absolute;
            inset: 0;
            opacity: 0.55;
        }

        /* Base gradient that shifts hue continuously */
        .bg-waves .wave-layer.wave-base {
            background: linear-gradient(
                135deg,
                #E8F0FE 0%,
                #F0E6F6 25%,
                #E6F3F8 50%,
                #FCE8EC 75%,
                #E8F0FE 100%
            );
            background-size: 400% 400%;
            animation: gradientShift 20s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes gradientShift {
            0%, 100%   { background-position: 0% 0%; }
            25%        { background-position: 100% 0%; }
            50%        { background-position: 100% 100%; }
            75%        { background-position: 0% 100%; }
        }

        /* Floating blur blobs */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            will-change: transform;
        }

        .bg-blob.blob-1 {
            width: 460px;
            height: 460px;
            background: #007AFF;
            opacity: 0.35;
            animation: blobFloat1 14s ease-in-out infinite;
        }

        .bg-blob.blob-2 {
            width: 380px;
            height: 380px;
            background: #AF52DE;
            opacity: 0.30;
            animation: blobFloat2 17s ease-in-out infinite;
        }

        .bg-blob.blob-3 {
            width: 420px;
            height: 420px;
            background: #5AC8FA;
            opacity: 0.35;
            animation: blobFloat3 15s ease-in-out infinite;
        }

        .bg-blob.blob-4 {
            width: 340px;
            height: 340px;
            background: #FF375F;
            opacity: 0.22;
            animation: blobFloat4 19s ease-in-out infinite;
        }

        .bg-blob.blob-5 {
            width: 300px;
            height: 300px;
            background: #34C759;
            opacity: 0.20;
            animation: blobFloat5 21s ease-in-out infinite;
        }

        @keyframes blobFloat1 {
            0%, 100% { transform: translate(5vw, 5vh) scale(1); }
            25%      { transform: translate(55vw, 30vh) scale(1.15); }
            50%      { transform: translate(70vw, 65vh) scale(0.9); }
            75%      { transform: translate(15vw, 70vh) scale(1.1); }
        }

        @keyframes blobFloat2 {
            0%, 100% { transform: translate(60vw, 10vh) scale(1.05); }
            25%      { transform: translate(10vw, 45vh) scale(0.85); }
            50%      { transform: translate(30vw, 75vh) scale(1.15); }
            75%      { transform: translate(75vw, 55vh) scale(0.95); }
        }

        @keyframes blobFloat3 {
            0%, 100% { transform: translate(40vw, 60vh) scale(0.9); }
            25%      { transform: translate(65vw, 15vh) scale(1.1); }
            50%      { transform: translate(10vw, 50vh) scale(1); }
            75%      { transform: translate(50vw, 75vh) scale(0.85); }
        }

        @keyframes blobFloat4 {
            0%, 100% { transform: translate(20vw, 50vh) scale(1); }
            33%      { transform: translate(50vw, 10vh) scale(1.2); }
            66%      { transform: translate(70vw, 60vh) scale(0.8); }
        }

        @keyframes blobFloat5 {
            0%, 100% { transform: translate(70vw, 40vh) scale(0.95); }
            50%      { transform: translate(15vw, 20vh) scale(1.1); }
        }

        /* Edge glow effect — simulates iOS Intelligence border glow */
        .edge-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .edge-glow::before,
        .edge-glow::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            animation: edgePulse 8s ease-in-out infinite;
        }

        .edge-glow::before {
            width: 350px;
            height: 350px;
            background: #5856D6;
            top: -120px;
            right: -80px;
            animation-delay: 0s;
        }

        .edge-glow::after {
            width: 300px;
            height: 300px;
            background: #007AFF;
            bottom: -100px;
            left: -80px;
            animation-delay: -4s;
        }

        @keyframes edgePulse {
            0%, 100% { opacity: 0.20; transform: scale(1); }
            50%      { opacity: 0.35; transform: scale(1.25); }
        }

        /* ========== Login Screen ========== */
        #loginScreen {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: transparent;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: saturate(180%) blur(30px);
            -webkit-backdrop-filter: saturate(180%) blur(30px);
            border-radius: 20px;
            padding: 44px 32px 36px;
            box-shadow: 0 2px 32px rgba(0,0,0,0.06), 0 0 0 0.5px rgba(0,0,0,0.06);
            text-align: center;
        }

        .login-icon {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #007AFF18, #5856D618);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            color: var(--ios-blue);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            color: var(--ios-text);
        }

        .login-subtitle {
            font-size: 15px;
            color: var(--ios-secondary);
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .ios-input-group {
            text-align: left;
            margin-bottom: 8px;
        }

        .ios-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            font-family: inherit;
            background: rgba(229, 229, 234, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: none;
            border-radius: 12px;
            color: var(--ios-text);
            outline: none;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .ios-input::placeholder { color: #AEAEB2; }

        .ios-input:focus {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.18);
        }

        #loginError {
            color: var(--ios-red);
            font-size: 13px;
            text-align: left;
            padding-left: 4px;
            height: 20px;
            margin-bottom: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .ios-btn-primary {
            width: 100%;
            padding: 15px 24px;
            font-size: 17px;
            font-weight: 600;
            font-family: inherit;
            color: #FFF;
            background: var(--ios-blue);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .ios-btn-primary:active {
            transform: scale(0.98);
            background: var(--ios-blue-hover);
        }

        .ios-btn-primary:disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        /* ========== Navigation Bar (frosted glass) ========== */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--ios-nav-blur);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--ios-separator);
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ios-text);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--ios-blue);
            color: #FFF;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .nav-avatar:active { opacity: 0.7; }

        .nav-link {
            font-size: 17px;
            color: var(--ios-blue);
            text-decoration: none;
            font-weight: 400;
            transition: opacity 0.2s;
        }

        .nav-link:active { opacity: 0.6; }

        /* ========== Main Content ========== */
        #appContent {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100dvh;
            display: none;
            flex-direction: column;
            background: transparent;
        }

        #appContent.show { display: flex; }

        #mainContainer {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            transition: justify-content 0.5s cubic-bezier(0.32, 0.72, 0, 1),
                        padding-top 0.5s cubic-bezier(0.32, 0.72, 0, 1);
        }

        #mainContainer.search-active {
            justify-content: flex-start;
            padding-top: 24px;
        }

        /* ========== Logo ========== */
        #logoContainer {
            text-align: center;
            margin-bottom: 32px;
            transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1);
        }

        #logoTitle {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -0.5px;
            transition: font-size 0.5s cubic-bezier(0.32, 0.72, 0, 1);
        }

        #logoTitle.small { font-size: 24px; }

        .logo-char { display: inline-block; }
        .logo-char:nth-child(1) { color: #007AFF; }
        .logo-char:nth-child(2) { color: #FF3B30; }
        .logo-char:nth-child(3) { color: #FF9500; }
        .logo-char:nth-child(4) { color: #007AFF; }
        .logo-char:nth-child(5) { color: #34C759; }
        .logo-char:nth-child(6) { color: #FF3B30; }
        .logo-char:nth-child(7) { color: #FF9500; }
        .logo-char:nth-child(8) { color: #34C759; }

        /* ========== Search Bar ========== */
        #searchBoxContainer {
            position: relative;
            width: 100%;
            max-width: 540px;
            transition: all 0.35s ease;
            z-index: 10;
        }

        .ios-search-bar {
            display: flex;
            align-items: center;
            background: rgba(229, 229, 234, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 0 14px;
            height: 44px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .ios-search-bar:focus-within {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.18);
        }

        .ios-search-bar svg {
            flex-shrink: 0;
            color: var(--ios-secondary);
        }

        .ios-search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 17px;
            font-family: inherit;
            color: var(--ios-text);
            padding: 0 10px;
            height: 100%;
        }

        .ios-search-input::placeholder { color: #AEAEB2; }

        /* ========== Buttons ========== */
        #searchButtons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            transition: opacity 0.3s;
        }

        .ios-btn-secondary {
            padding: 10px 28px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            color: var(--ios-blue);
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .ios-btn-secondary:active {
            background: rgba(229, 229, 234, 0.8);
            transform: scale(0.97);
        }

        /* ========== Learn More Cards ========== */
        #learnMoreSection {
            width: 100%;
            max-width: 540px;
            margin-top: 32px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            transition: opacity 0.4s, transform 0.4s;
        }

        @media (max-width: 480px) {
            #learnMoreSection { grid-template-columns: 1fr; }
        }

        .ios-info-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 14px;
            text-decoration: none;
            color: var(--ios-text);
            box-shadow: 0 1px 6px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }

        .ios-info-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.9);
        }

        .ios-info-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .ios-info-icon.blue  { background: #007AFF15; }
        .ios-info-icon.green { background: #34C75915; }

        .ios-info-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--ios-text);
            margin-bottom: 2px;
        }

        .ios-info-desc {
            font-size: 13px;
            color: var(--ios-secondary);
        }

        /* ========== Back Button ========== */
        #backButtonContainer {
            width: 100%;
            max-width: 540px;
            margin-top: 20px;
            display: none;
            transition: all 0.3s;
        }

        #backButtonContainer.show { display: flex; }

        .ios-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 17px;
            font-family: inherit;
            color: var(--ios-blue);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            transition: opacity 0.2s;
        }

        .ios-back-btn:active { opacity: 0.6; }

        /* ========== Results ========== */
        #resultsArea {
            width: 100%;
            max-width: 540px;
            margin-top: 8px;
            display: none;
            flex-direction: column;
            gap: 1px;
        }

        #resultsArea.show { display: flex; }

        .result-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            cursor: pointer;
            transition: background 0.15s;
            animation: rowFadeIn 0.4s cubic-bezier(0.32, 0.72, 0, 1) forwards;
            opacity: 0;
            transform: translateY(8px);
        }

        .result-card:first-child { border-radius: 14px 14px 0 0; }
        .result-card:last-child  { border-radius: 0 0 14px 14px; }
        .result-card:only-child  { border-radius: 14px; }

        .result-card:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 68px;
            right: 0;
            height: 0.5px;
            background: var(--ios-separator);
        }

        .result-card:active { background: rgba(255, 255, 255, 0.95); }

        @keyframes rowFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .result-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #FFF;
            flex-shrink: 0;
        }

        .result-avatar.c0 { background: #007AFF; }
        .result-avatar.c1 { background: #FF9500; }
        .result-avatar.c2 { background: #34C759; }
        .result-avatar.c3 { background: #FF3B30; }
        .result-avatar.c4 { background: #AF52DE; }

        .result-info { flex: 1; margin-left: 14px; }

        .result-name {
            font-size: 17px;
            font-weight: 500;
            color: var(--ios-text);
            letter-spacing: -0.2px;
        }

        .result-detail {
            font-size: 14px;
            color: var(--ios-secondary);
            margin-top: 2px;
        }

        .result-chevron {
            color: #C7C7CC;
            flex-shrink: 0;
        }

        /* ========== Empty / Error / Loading States ========== */
        .state-box {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 14px;
            padding: 32px 24px;
            text-align: center;
        }

        .state-box .state-icon { font-size: 40px; margin-bottom: 12px; }

        .state-box .state-title {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .state-box .state-desc {
            font-size: 15px;
            color: var(--ios-secondary);
            line-height: 1.5;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(229, 229, 234, 0.6);
            border-top-color: var(--ios-blue);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== Detail Sheet (bottom sheet) ========== */
        #detailModal {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
        }

        #detailModal.show {
            pointer-events: auto;
        }

        .sheet-overlay {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: rgba(0, 0, 0, 0.35);
            opacity: 0;
            transition: opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        #detailModal.show .sheet-overlay { opacity: 1; }

        .sheet-content {
            position: absolute;
            bottom: 0;
            left: 50%;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: #FFFFFF;
            border-radius: 20px 20px 0 0;
            padding: 8px 0 max(36px, env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%) translateY(100%);
            transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85vh;
            overflow-y: auto;
        }

        #detailModal.show .sheet-content { transform: translateX(-50%) translateY(0); }

        .sheet-handle {
            width: 36px;
            height: 5px;
            background: #D1D1D6;
            border-radius: 3px;
            margin: 0 auto 20px;
        }

        .sheet-close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--ios-fill);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ios-secondary);
            transition: background 0.2s;
            z-index: 2;
        }

        .sheet-close-btn:active { background: #D1D1D6; }

        .sheet-avatar-lg {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 600;
            color: #FFF;
            background: var(--ios-blue);
            margin: 0 auto 12px;
        }

        .sheet-name {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 2px;
        }

        .sheet-id {
            text-align: center;
            font-size: 15px;
            color: var(--ios-secondary);
            margin-bottom: 24px;
            font-variant-numeric: tabular-nums;
        }

        .sheet-info-list {
            margin: 0 20px;
            background: rgba(249, 249, 251, 0.8);
            border-radius: 12px;
            overflow: hidden;
        }

        .sheet-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
        }

        .sheet-info-row:not(:last-child) {
            border-bottom: 0.5px solid var(--ios-separator);
        }

        .sheet-info-label {
            font-size: 15px;
            color: var(--ios-secondary);
        }

        .sheet-info-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--ios-text);
            text-align: right;
            max-width: 60%;
        }

        /* ========== Footer ========== */
        .ios-footer {
            background: var(--ios-nav-blur);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-top: 0.5px solid var(--ios-separator);
            padding: 16px 20px max(16px, env(safe-area-inset-bottom, 0px));
            text-align: center;
            margin-top: auto;
            font-size: 13px;
            color: var(--ios-secondary);
        }

        .ios-footer a {
            color: var(--ios-blue);
            text-decoration: none;
        }

        .ios-footer a:active { opacity: 0.6; }
    </style>
</head>
<body>

    <!-- ==================== Animated Wave Background ==================== -->
    <div class="bg-waves">
        <div class="wave-layer wave-base"></div>
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>
        <div class="bg-blob blob-4"></div>
        <div class="bg-blob blob-5"></div>
    </div>
    <div class="edge-glow"></div>

    <!-- ==================== Login Screen ==================== -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    <circle cx="12" cy="16" r="1"/>
                </svg>
            </div>
            <h2 class="login-title">管理员验证</h2>
            <p class="login-subtitle">此系统包含内部学生数据，请输入密码以继续</p>

            <div class="ios-input-group">
                <input type="password" id="loginPasswordInput" class="ios-input" placeholder="输入管理员密码" autocomplete="off">
            </div>
            <div id="loginError">密码错误，请重试</div>

            <button onclick="handleLogin()" id="loginBtn" class="ios-btn-primary">进入系统</button>
        </div>
    </div>

    <!-- ==================== Main App ==================== -->
    <div id="appContent">

        <!-- Navigation Bar -->
        <nav class="nav-bar">
            <a href="#" class="nav-link">关于</a>
            <span class="nav-title">学生信息</span>
            <div class="nav-avatar" title="管理员">A</div>
        </nav>

        <!-- Main Content -->
        <main id="mainContainer">

            <!-- Logo / Title -->
            <div id="logoContainer">
                <h1 id="logoTitle">
                    <span class="logo-char">学</span><span class="logo-char">生</span><span class="logo-char">信</span><span class="logo-char">息</span><span class="logo-char">查</span><span class="logo-char">询</span><span class="logo-char">系</span><span class="logo-char">统</span>
                </h1>
            </div>

            <!-- Search Bar -->
            <div id="searchBoxContainer">
                <div class="ios-search-bar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="keywordInput" class="ios-search-input" placeholder="搜索学生姓名或学号" autocomplete="off">
                </div>
            </div>

            <!-- Search Button (initial state) -->
            <div id="searchButtons">
                <button onclick="handleSearch()" class="ios-btn-secondary">搜索</button>
            </div>

            <!-- Info Cards (initial state) -->
            <div id="learnMoreSection">
                <a href="https://www.guet.edu.cn" target="_blank" class="ios-info-card">
                    <div class="ios-info-icon blue">🏫</div>
                    <div>
                        <div class="ios-info-title">桂林电子科技大学</div>
                        <div class="ios-info-desc">访问官方网站</div>
                    </div>
                </a>
                <a href="https://www.google.com" target="_blank" class="ios-info-card">
                    <div class="ios-info-icon green">🌐</div>
                    <div>
                        <div class="ios-info-title">Google 搜索</div>
                        <div class="ios-info-desc">全球搜索引擎</div>
                    </div>
                </a>
            </div>

            <!-- Back Button (results state) -->
            <div id="backButtonContainer">
                <button onclick="resetSearch()" class="ios-back-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                    返回
                </button>
            </div>

            <!-- Results Area -->
            <div id="resultsArea"></div>

        </main>

        <!-- Footer -->
        <footer class="ios-footer">
            <a href="https://www.baidu.com" target="_blank">遇到问题？用百度搜索 &rarr;</a>
        </footer>
    </div>

    <!-- ==================== Detail Sheet (Bottom Sheet) ==================== -->
    <div id="detailModal">
        <div class="sheet-overlay" onclick="closeModal()"></div>
        <div class="sheet-content">
            <div class="sheet-handle"></div>
            <button class="sheet-close-btn" onclick="closeModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>

            <div id="modalAvatar" class="sheet-avatar-lg"></div>
            <div id="modalName" class="sheet-name"></div>
            <div id="modalId" class="sheet-id"></div>

            <div class="sheet-info-list">
                <div class="sheet-info-row">
                    <span class="sheet-info-label">学校</span>
                    <span id="modalSchool" class="sheet-info-value"></span>
                </div>
                <div class="sheet-info-row">
                    <span class="sheet-info-label">宿舍</span>
                    <span id="modalDorm" class="sheet-info-value"></span>
                </div>
                <div class="sheet-info-row">
                    <span class="sheet-info-label">年级</span>
                    <span id="modalGrade" class="sheet-info-value"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== JavaScript ==================== -->
    <script>
        let currentStudentsData = [];
        let sessionPassword = "";

        // ── Login ──────────────────────────────────────────
        async function handleLogin() {
            const pwdInput = document.getElementById('loginPasswordInput').value.trim();
            const errorMsg = document.getElementById('loginError');
            const loginBtn  = document.getElementById('loginBtn');

            if (!pwdInput) {
                errorMsg.textContent = "请输入密码";
                errorMsg.style.opacity = '1';
                return;
            }

            loginBtn.innerHTML = `<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div> 验证中...`;
            loginBtn.disabled = true;
            errorMsg.style.opacity = '0';

            try {
                const response = await fetch(`/api/login?password=${encodeURIComponent(pwdInput)}`);
                const resData = await response.json();

                if (resData.status === "success") {
                    sessionPassword = pwdInput;

                    const loginScreen = document.getElementById('loginScreen');
                    const appContent  = document.getElementById('appContent');

                    loginScreen.style.opacity = '0';
                    setTimeout(() => {
                        loginScreen.style.display = 'none';
                        appContent.classList.add('show');
                    }, 350);

                } else {
                    errorMsg.textContent = resData.message || "密码错误，请重试";
                    errorMsg.style.opacity = '1';
                    loginBtn.innerHTML = '进入系统';
                    loginBtn.disabled = false;
                }
            } catch (error) {
                errorMsg.textContent = "无法连接服务器，请确认后端已启动";
                errorMsg.style.opacity = '1';
                loginBtn.innerHTML = '进入系统';
                loginBtn.disabled = false;
            }
        }

        document.getElementById('loginPasswordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        // ── Search Layout Toggle ──────────────────────────
        function switchToSearchLayout() {
            const mc = document.getElementById('mainContainer');
            const lt = document.getElementById('logoTitle');
            const ls = document.getElementById('learnMoreSection');
            const sb = document.getElementById('searchButtons');
            const bb = document.getElementById('backButtonContainer');
            const ra = document.getElementById('resultsArea');

            mc.classList.add('search-active');
            lt.classList.add('small');
            ls.style.display = 'none';
            sb.style.display = 'none';
            bb.classList.add('show');
            ra.classList.add('show');
        }

        function resetSearch() {
            const mc = document.getElementById('mainContainer');
            const lt = document.getElementById('logoTitle');
            const ls = document.getElementById('learnMoreSection');
            const sb = document.getElementById('searchButtons');
            const bb = document.getElementById('backButtonContainer');
            const ra = document.getElementById('resultsArea');

            document.getElementById('keywordInput').value = '';

            mc.classList.remove('search-active');
            lt.classList.remove('small');
            ls.style.display = '';
            sb.style.display = '';
            bb.classList.remove('show');
            ra.classList.remove('show');
            ra.innerHTML = '';
        }

        // ── Search ────────────────────────────────────────
        async function handleSearch() {
            const keyword = document.getElementById('keywordInput').value.trim();
            const resultsArea = document.getElementById('resultsArea');

            if (!keyword) {
                alert("请输入查询关键词");
                return;
            }

            switchToSearchLayout();

            resultsArea.innerHTML = `
                <div class="state-box">
                    <div class="spinner" style="margin:0 auto 16px;"></div>
                    <p class="state-desc" style="margin:0;">正在查询...</p>
                </div>
            `;

            try {
                const kw   = encodeURIComponent(keyword);
                const pwd  = encodeURIComponent(sessionPassword);
                const response = await fetch(`/api/search?keyword=${kw}&password=${pwd}`);
                const resData  = await response.json();

                if (resData.status === "error") {
                    resultsArea.innerHTML = `
                        <div class="state-box">
                            <div class="state-icon">⚠️</div>
                            <p class="state-title">获取数据失败</p>
                            <p class="state-desc">${resData.message}</p>
                            <button onclick="location.reload()" class="ios-back-btn" style="margin-top:12px;color:var(--ios-blue);">重新登录</button>
                        </div>
                    `;
                    return;
                }

                if (resData.status === "success" && resData.data.length > 0) {
                    currentStudentsData = resData.data;
                    resultsArea.innerHTML = renderCards(currentStudentsData);
                } else {
                    resultsArea.innerHTML = `
                        <div class="state-box">
                            <div class="state-icon">📭</div>
                            <p class="state-title">未找到结果</p>
                            <p class="state-desc">找不到和 "<b>${keyword}</b>" 相符的学生信息<br>请检查输入，或尝试其他关键词</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultsArea.innerHTML = `
                    <div class="state-box">
                        <div class="state-icon">❌</div>
                        <p class="state-title">连接失败</p>
                        <p class="state-desc">无法连接到后端服务器</p>
                    </div>
                `;
            }
        }

        function renderCards(dataArr) {
            return dataArr.map((item, index) => {
                const actualIndex = currentStudentsData.indexOf(item);
                const colorIdx = actualIndex % 5;
                const delay = (index * 0.06);
                return `
                <div onclick="openModal(${actualIndex})"
                     class="result-card"
                     style="animation-delay:${delay}s;">
                    <div class="result-avatar c${colorIdx}">${item.name.charAt(0)}</div>
                    <div class="result-info">
                        <div class="result-name">${item.name}</div>
                        <div class="result-detail">学号 ${item.student_id}</div>
                    </div>
                    <svg class="result-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </div>
                `;
            }).join('');
        }

        // ── Detail Sheet ──────────────────────────────────
        function openModal(index) {
            // Prevent opening while close animation is in progress
            if (modalAnimating) return;

            const student = currentStudentsData[index];
            document.getElementById('modalAvatar').textContent = student.name.charAt(0);
            document.getElementById('modalName').textContent   = student.name;
            document.getElementById('modalId').textContent     = '学号 ' + student.student_id;
            document.getElementById('modalSchool').textContent = student.school;
            document.getElementById('modalDorm').textContent   = student.dormitory;
            document.getElementById('modalGrade').textContent  = student.grade;

            const modal = document.getElementById('detailModal');
            // Force layout so browser registers the initial (hidden) transform as the transition start point
            void modal.offsetHeight;

            requestAnimationFrame(() => {
                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            });
        }

        let modalAnimating = false;

        function closeModal() {
            modalAnimating = true;
            const modal = document.getElementById('detailModal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
            setTimeout(() => { modalAnimating = false; }, 500);
        }

        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSearch();
        });
    </script>

</body>
</html>
